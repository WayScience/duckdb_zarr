name: Publish Extension Repository

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  DUCKDB_VERSION: v1.5.0

permissions:
  contents: write

concurrency:
  group: extension-repository
  cancel-in-progress: false

jobs:
  build-extension-binaries:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.0
    with:
      duckdb_version: v1.5.0
      ci_tools_version: v1.5.0
      extension_name: duckdb_zarr

  package-repository:
    name: Package static extension repository
    runs-on: ubuntu-latest
    needs: build-extension-binaries
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: duckdb_zarr-${{ env.DUCKDB_VERSION }}-extension-*
          path: build/distribution-artifacts
          merge-multiple: false

      - name: Package repository layout
        run: |
          python3 scripts/package_extension_repository.py \
            --artifacts-dir build/distribution-artifacts \
            --out-dir build/extension-repository \
            --extension-name duckdb_zarr \
            --duckdb-version ${{ env.DUCKDB_VERSION }}

      - name: Publish repository branch
        env:
          TARGET_BRANCH: extension-repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf build/repository-branch
          mkdir -p build/repository-branch
          cp -R build/extension-repository/. build/repository-branch/

          touch build/repository-branch/.nojekyll

          cd build/repository-branch
          git init
          git checkout -b "${TARGET_BRANCH}"
          git add .
          git commit -m "Publish extension repository for ${GITHUB_REF_NAME}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "${TARGET_BRANCH}"
